<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Liang Wang avatar</title>
  <desc id="desc">Blue gradient avatar with the initials WL</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#185eb5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(194 54) rotate(132) scale(126)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="128" fill="url(#bg)"/>
  <rect width="256" height="256" rx="128" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <text x="128" y="151" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="70" font-weight="700" letter-spacing="-5" text-anchor="middle">WL</text>
</svg>
