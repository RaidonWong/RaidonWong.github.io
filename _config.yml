# Minimal Mistakes theme settings
minimal_mistakes_skin: "default"

# Site settings
locale: "en-US"
title: "Liang Wang"
title_separator: "·"
subtitle: ""
name: "Liang Wang"
description: "Liang Wang's academic homepage: research, publications, projects, and notes."
url: "https://raidonwong.github.io"
baseurl: ""
repository: "RaidonWong/RaidonWong.github.io"
timezone: "Asia/Shanghai"
breadcrumbs: true
words_per_minute: 300
enable_copy_code_button: true
search: false

# SEO and feeds
social:
  type: "Person"
  name: "Liang Wang"
  links:
    - "https://github.com/RaidonWong"
    - "https://scholar.google.com/citations?user=K9KoJt8AAAAJ&hl=en"
atom_feed:
  path: "feed.xml"

# Site author
author:
  name: "Liang Wang"
  avatar: "/assets/images/avatar.svg"
  bio: "Graduate Student at Fudan University"
  location: "Shanghai, China"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=K9KoJt8AAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/RaidonWong"

# Footer
footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=K9KoJt8AAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/RaidonWong"
  since: "2026"

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - CHANGELOG.md
  - CUSTOMIZE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Rakefile
  - docs
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - staticman.yml
  - test
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Sass
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import

# URLs
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
